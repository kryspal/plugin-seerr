# Release for one plugin repository: push a tag such as v1.2.3.
# This workflow builds and publishes a GitHub Release. It never touches a catalog signing key or a bucket.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
env:
  PLUGIN_ID: seerr
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: Tag must match VERSION
        run: test "${GITHUB_REF_NAME}" = "v$(tr -d '[:space:]' < VERSION)"
      - run: go vet ./... && go test -race -count=1 ./...
      - name: Build and package
        run: bash .github/scripts/package.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
